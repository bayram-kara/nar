<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Nar</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: warm, calm, encouraging — a personal food diary, never a scolding scale
   IDEA: a pomegranate — every seed is a bite of the day's budget
   PICTURE: the day's pomegranate fills seed by seed as meals are logged
   COLOUR and TYPE: garnet, seed red, leaf green on blush white / deep plum night; Fraunces numbers, Manrope text
   LAYOUT: one column, hero pomegranate + remaining kcal, macros, meals; bottom tab bar */
:root{color-scheme:light dark;
  --bg:light-dark(#FBF4F2,#140A0F);--card:light-dark(#FFFFFF,#1F1118);--card2:light-dark(#F7EAEA,#2A1720);
  --ink:light-dark(#2A0F18,#F6E8EB);--muted:light-dark(#7A5D65,#B7969E);--line:light-dark(#EBD7DA,#3A2129);
  --garnet:light-dark(#8E1838,#FF6B86);--seed:light-dark(#D93A58,#FF7D93);--seedoff:light-dark(#F3DFE2,#3A2028);--pulp:light-dark(#FFF3F4,#2A121B);
  --leaf:light-dark(#4D7A3A,#8CCB6E);--amber:light-dark(#A8650B,#F2B44C);--blue:light-dark(#2E62B8,#7FB2FF);--violet:light-dark(#6E4BB8,#B9A2FF);
  --shadow:0 1px 2px rgb(60 10 25/.06),0 6px 22px rgb(60 10 25/.07);
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:clip;padding-top:var(--safe-t);padding-bottom:calc(76px + var(--safe-b))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0;font-weight:600;line-height:1.15}
.num{font-family:Fraunces,Georgia,serif;font-variant-numeric:tabular-nums;font-weight:600}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
header.top{display:flex;align-items:center;gap:10px;padding:14px 0 10px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand svg{width:34px;height:34px}
.brand b{font:600 24px/1 Fraunces,serif;letter-spacing:-.3px}
.brand small{display:block;font-size:13px;color:var(--muted);margin-top:3px}
.datenav{display:flex;align-items:center;gap:4px}
.ib{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;padding:0}
.ib svg{width:18px;height:18px}
.dlab{min-width:92px;text-align:center;font-weight:700;font-size:14px;line-height:1.2;background:none;border:0;padding:4px}
.dlab small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:16px;margin:0 0 14px}
.card h2{font-size:17px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h2 .sp{margin-left:auto}
.sub{color:var(--muted);font-size:14px}
.hero{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr);gap:16px;align-items:center}
.hero svg{width:100%;height:auto;display:block}
.left .big{font-size:clamp(40px,11vw,52px);line-height:1;display:block;letter-spacing:-1px}
.left span{font-size:14px;color:var(--muted)}
.left .over{color:var(--amber)}
.krow{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:15px}
.krow div{white-space:nowrap}.krow i{font-style:normal;color:var(--muted)}
.bonus{margin-top:8px;font-size:13px;color:var(--leaf);font-weight:600}
.macros{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px;margin-top:16px}
.mac .t{display:flex;justify-content:space-between;gap:6px;font-size:14px;font-weight:600}
.mac .t em{font-style:normal;color:var(--muted);font-weight:500;white-space:nowrap;font-size:13px}
.bar{height:9px;border-radius:9px;background:var(--seedoff);overflow:hidden;margin-top:5px}
.bar>i{display:block;height:100%;border-radius:9px;background:var(--c,var(--seed));transition:width .5s ease}
.water{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.glass{width:34px;height:42px;border:0;background:none;padding:0}
.glass svg{width:100%;height:100%}
.meal{border-top:1px solid var(--line);padding:12px 0 4px}
.meal:first-of-type{border-top:0;padding-top:0}
.mh{display:flex;align-items:center;gap:8px}
.mh h3{font-size:16px}
.mh .k{margin-left:auto;font-size:14px;color:var(--muted);white-space:nowrap}
.add{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:0 12px;min-height:38px;font-size:14px;font-weight:600;color:var(--garnet)}
.add svg{width:16px;height:16px}
.items{list-style:none;margin:8px 0 6px;padding:0}
.items li{display:flex;align-items:center;gap:10px;padding:8px 2px;border-radius:10px}
.items li button.it{all:unset;cursor:pointer;flex:1;display:flex;flex-direction:column;min-width:0}
.items .n{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.items .q{font-size:13px;color:var(--muted)}
.items .kc{font-size:14px;font-weight:700;white-space:nowrap}
.lnk{border:0;background:none;color:var(--garnet);font-weight:600;font-size:14px;padding:6px 0;min-height:36px}
.btn{border:0;border-radius:14px;background:var(--garnet);color:#fff;font-weight:700;min-height:48px;padding:0 18px;font-size:16px}
:root[data-theme=dark] .btn,.btn{color:light-dark(#fff,#1A0910)}
.btn.ghost{background:var(--card2);color:var(--ink)}
.btn.sm{min-height:40px;font-size:14px;padding:0 14px;border-radius:12px}
.btn:focus-visible,.ib:focus-visible,.add:focus-visible,input:focus-visible,select:focus-visible,.chip:focus-visible{outline:3px solid color-mix(in srgb,var(--seed) 55%,transparent);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.f{display:flex;flex-direction:column;gap:4px}
.f label,.f>span{font-size:13px;font-weight:600;color:var(--muted)}
.f-wide{grid-column:1/-1}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;min-height:46px;border:1px solid var(--line);border-radius:12px;background:light-dark(#fff,#170C12);padding:0 12px;font-size:16px}
textarea{padding:10px 12px;min-height:110px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;min-height:38px;padding:0 13px;font-size:14px;font-weight:600}
.chip.on{background:var(--garnet);border-color:var(--garnet);color:light-dark(#fff,#1A0910)}
.note{border-radius:14px;padding:12px 14px;background:color-mix(in srgb,var(--c,var(--seed)) 11%,var(--card));border:1px solid color-mix(in srgb,var(--c,var(--seed)) 28%,transparent);font-size:14px;margin:0 0 14px}
.note b{display:block;margin-bottom:2px}
.note .row{margin-top:8px}
/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{border:0;background:none;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--garnet)}
section.tab{display:none}section.tab.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* sheet */
#ov{position:fixed;inset:0;z-index:50;background:rgb(25 5 12/.45);display:none;align-items:flex-end;justify-content:center}
#ov.on{display:flex}
#sh{background:var(--card);width:100%;max-width:640px;max-height:90vh;max-height:90dvh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 16px calc(20px + var(--safe-b));animation:up .22s ease}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
#sh h2{font-size:20px;margin-bottom:4px}
.grab{width:42px;height:5px;border-radius:5px;background:var(--line);margin:-6px auto 12px}
.fl{display:flex;flex-direction:column;margin-top:8px}
.fr{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:11px 2px;min-height:52px}
.fr span{font-weight:600;font-size:15px}
.fr em{font-style:normal;font-size:13px;color:var(--muted);white-space:nowrap;text-align:right}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;margin-right:6px;background:var(--card2);color:var(--garnet);vertical-align:1px}
.psum{display:grid;grid-template-columns:auto 1fr;gap:0 10px;align-items:baseline;background:var(--card2);border-radius:16px;padding:14px;margin-top:12px}
.psum b{font-size:40px;line-height:1}.psum em{font-style:normal;font-size:14px;color:var(--muted)}
.psum small{grid-column:1/-1;font-size:13px;color:var(--muted);margin-top:4px}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.star{border:0;background:none;font-size:24px;line-height:1;color:var(--amber);min-width:44px;min-height:44px}
/* charts */
.fig{position:relative;height:200px;margin-top:4px}
.fig svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.fig text{font:12px Manrope,sans-serif;fill:var(--muted)}
.stat3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat3 div{background:var(--card2);border-radius:14px;padding:10px 12px}
.stat3 b{font-size:24px;display:block;line-height:1.1}
.stat3 span{font-size:12px;color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.bd{text-align:center;padding:10px 6px;border-radius:16px;background:var(--card2);opacity:.45}
.bd.on{opacity:1}
.bd svg{width:42px;height:42px}
.bd b{display:block;font-size:13px;margin-top:4px;line-height:1.2}
.bd small{display:block;font-size:11px;color:var(--muted);margin-top:2px;line-height:1.25}
.why{list-style:none;padding:0;margin:6px 0 0;font-size:14px}
.why li{padding:2px 0}
.why .p{color:var(--leaf);font-weight:700}.why .m{color:var(--seed);font-weight:700}.why .o{color:var(--muted);font-weight:700}
.score{display:flex;align-items:center;gap:14px}
.score b{font-size:44px;line-height:1}
.actl li{display:flex;gap:10px;align-items:center;padding:6px 0}
#toast{position:fixed;left:50%;bottom:calc(86px + var(--safe-b));transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 14px;font-size:14px;font-weight:600;display:flex;gap:12px;align-items:center;transition:.25s;z-index:60;max-width:92vw}
#toast.on{opacity:1;transform:translateX(-50%);pointer-events:auto}
#toast button{border:0;background:none;color:light-dark(#FF8FA3,#B5173C);font-weight:800;padding:4px 6px;white-space:nowrap;min-height:36px}
.empty{font-size:14px;color:var(--muted);margin:6px 0}
table.wk{width:100%;border-collapse:collapse;font-size:14px}
table.wk td,table.wk th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.wk th:first-child,table.wk td:first-child{text-align:left}
table.wk th{font-size:12px;color:var(--muted);font-weight:600}
.scroll{overflow-x:auto}
.ok{color:var(--leaf);font-weight:700}
.hi{background:linear-gradient(135deg,#6E1230,#C42E4E);color:#fff;border:0}
.hi h2,.hi .sub{color:#fff}.hi .sub{opacity:.85}
.hil{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:8px}
.hil li{display:flex;gap:10px;align-items:baseline;font-size:15px}.hil li b{font-size:22px;min-width:64px}
@media(max-width:380px){.hero{grid-template-columns:110px minmax(0,1fr)}.macros{gap:10px}}
</style>
</head>

function dietQuality(dt){const d=S.days[dt];const t=totals(d);if(!t.n||!(dt<today()||t.secs>=3))return null;const all=MEALS.flatMap(([k])=>d.meals[k]||[]);const has=(x,tg)=>(x.tags||[]).includes(tg);const cnt=tg=>all.filter(x=>has(x,tg)).length;
  const port=x=>x.g?Math.max(1,Math.min(2,Math.floor(x.g/70))):1;const vf=all.filter(x=>has(x,'sebze')||has(x,'meyve')).reduce((a,x)=>a+port(x),0);let s=60;const why=[];
  if(vf===0){s-=15;why.push(['m','sebze/meyve yok'])}else if(vf>=3){s+=20;why.push(['p',`${vf} porsiyon sebze/meyve`])}else if(vf===2){s+=10;why.push(['p','2 porsiyon sebze/meyve'])}else why.push(['o','1 porsiyon sebze/meyve']);
  const pm=['kahvalti','ogle','aksam'].filter(k=>(d.meals[k]||[]).reduce((a,x)=>a+(x.p||0),0)>=20).length;if(pm){s+=pm*6;why.push(['p',`${pm} öğünde 20 g+ protein`])}
  if(cnt('tamtahil')){s+=5;why.push(['p','tam tahıl'])}
  const FT=targets(dt).fib;if(t.fib>=FT*.85){s+=10;why.push(['p',`lif ${fx(t.fib)} g`])}else if(t.fib<FT*.5){s-=10;why.push(['m',`lif az (${fx(t.fib)} g)`])}else why.push(['o',`lif ${fx(t.fib)} g`]);
  const pr=cnt('islenmis'),sg=cnt('seker'),fr=cnt('kizartma');if(pr){s-=Math.min(30,pr*10);why.push(['m',`${pr} işlenmiş gıda`])}if(sg){s-=Math.min(30,sg*10);why.push(['m',`${sg} şekerli`])}if(fr){s-=Math.min(24,fr*8);why.push(['m',`${fr} kızartma`])}
  return{score:clamp(Math.round(s)),why,vf}}
function myFoods(){return S.myFoods}
function foodSearch(q){const k=normKey(q);if(k.length<2)return[];const words=k.split(' ');
  const sc=(key,name)=>{const n=normKey(name);if(n===k||n.startsWith(k+' '))return 5;if(n.startsWith(k))return 4;if(n.includes(k))return 3;if(words.every(w=>key.includes(w)))return 2;return key.includes(k)?1:0};
  const mine=myFoods().map(f=>({src:'my',f,s:sc(normKey(f.name),f.name)+1.5,c:0})).filter(x=>x.s>1.5);
  const db=FDB.map((f,i)=>({src:'db',f,s:sc(f.key,f.name),c:i<CORE?0:1})).filter(x=>x.s>0);
  return[...mine,...db].sort((a,b)=>b.s-a.s||a.c-b.c||a.f.name.length-b.f.name.length).slice(0,30)}
function getPick(ref){const[src,id]=String(ref).split(':');const f=src==='db'?FDB.find(x=>x.id===id):myFoods().find(x=>x.id===id);return f?{src,f,ref}:null}
function dbItem(f,g,lab){const k=g/100;return{name:f.name,qty:lab?`${lab} (${fx(g)} g)`:`${fx(g)} g`,g:Math.round(g),kcal:Math.round(f.kcal*k),p:r1(f.p*k),c:r1(f.c*k),f:r1(f.f*k),fib:r1(f.fib*k),tags:f.tags}}
function myItem(f,m){return{name:f.name,qty:`${uLab(m,f.unit)}${f.g?` (${fx(f.g*m)} g)`:''}`,g:f.g?Math.round(f.g*m):null,kcal:Math.round(f.kcal*m),p:r1(f.p*m),c:r1(f.c*m),f:r1(f.f*m),fib:r1((f.fib||0)*m),tags:f.tags||[]}}
function addItem(k,it,dt=CUR){const d=D(dt);d.meals=d.meals||{};const x={...it,id:uid()};(d.meals[k]=d.meals[k]||[]).push(x);save();render();toast(`${it.name} eklendi`,()=>{d.meals[k]=d.meals[k].filter(y=>y.id!==x.id);save();render()})}
function recents(){const out=[],seen=new Set();const ks=Object.keys(S.days).sort().reverse().slice(0,40);
  for(const k of ks){const d=S.days[k];if(!d.meals)continue;for(const[m]of MEALS)for(const x of(d.meals[m]||[]).slice().reverse()){const key=x.name+'|'+x.qty;if(seen.has(key))continue;seen.add(key);out.push(x);if(out.length>=15)return out}}return out}
const isFav=ref=>S.favs.includes(ref);

/* ---------- body ---------- */
function measures(dt){const out={};const ks=Object.keys(S.days).filter(k=>k<=dt).sort().reverse();for(const k of ks){const d=S.days[k];['waist','neck','hip'].forEach(x=>{if(out[x]==null&&d[x]!=null)out[x]=d[x]});if(out.waist!=null&&out.neck!=null&&out.hip!=null)break}return out}
function navyBF(dt){const p=P();const h=num(p.height);if(!h)return null;const m=measures(dt);if(m.waist==null||m.neck==null)return null;let bf;
  if(p.sex!=='e'){if(m.hip==null)return null;const v=m.waist+m.hip-m.neck;if(v<=0)return null;bf=495/(1.29579-0.35004*Math.log10(v)+0.221*Math.log10(h))-450}
  else{if(m.waist<=m.neck)return null;bf=495/(1.0324-0.19077*Math.log10(m.waist-m.neck)+0.15456*Math.log10(h))-450}
  return bf>2&&bf<70?bf:null}
function trendSeries(from,to){const ks=Object.keys(S.days).filter(k=>S.days[k].w!=null).sort();if(!ks.length)return[];let t=null;const out=[];let dt=ks[0];const end=to;
  while(dt<=end){const w=(S.days[dt]||{}).w;if(w!=null)t=t==null?w:t+.1*(w-t);if(t!=null&&dt>=from)out.push({d:dt,t:r1(t),w:w==null?null:w});dt=addDays(dt,1)}return out}

/* ---------- cycle ---------- */
function cycleInfo(dt){const starts=Object.keys(S.days).filter(k=>k<=dt&&S.days[k].period&&!(S.days[addDays(k,-1)]||{}).period).sort();if(!starts.length)return null;
  const gaps=[];for(let i=1;i<starts.length;i++){const g=diffDays(starts[i],starts[i-1]);if(g>=21&&g<=40)gaps.push(g)}const recent=gaps.slice(-6);const len=recent.length?Math.round(recent.reduce((a,b)=>a+b)/recent.length):28;
  const last=starts[starts.length-1];let next=addDays(last,len);while(next<dt&&diffDays(dt,next)>7)next=addDays(next,len);return{last,len,next,est:!recent.length,toNext:diffDays(next,dt),inPeriod:!!(S.days[dt]||{}).period}}
/* ---------- streaks & badges ---------- */
function streak(){let dt=today();if(!logged(dt))dt=addDays(dt,-1);let n=0;while(logged(dt)){n++;dt=addDays(dt,-1)}return n}
function bestStreak(){const ks=Object.keys(S.days).filter(logged).sort();let best=0,run=0,prev=null;ks.forEach(k=>{run=prev&&diffDays(k,prev)===1?run+1:1;best=Math.max(best,run);prev=k});return best}
function badgeList(){const ks=Object.keys(S.days).filter(logged);const days=ks.map(k=>({k,d:S.days[k],t:totals(S.days[k]),T:targets(k)}));
  const cnt=fn=>days.filter(fn).length;const bs=bestStreak();const sess=Object.values(S.days).reduce((a,d)=>a+(d.acts||[]).length,0);const wn=Object.values(S.days).filter(d=>d.w!=null).length;
  const waterDays=Object.keys(S.days).filter(k=>(S.days[k].water||0)>=targets(k).water).length;const veg=days.filter(x=>{const q=dietQuality(x.k);return q&&q.vf>=5}).length;
  return[['ilk','İlk tohum','İlk yiyeceğini ekledin',ks.length>=1],['s3','3 gün seri','3 gün üst üste kayıt',bs>=3],['s7','Bir hafta','7 gün üst üste kayıt',bs>=7],['s30','Nar ağacı','30 gün üst üste kayıt',bs>=30],
    ['pro','Protein kraliçesi','5 gün protein hedefi',cnt(x=>x.t.p>=x.T.p*.95)>=5],['lif','Lif ustası','5 gün lif hedefi',cnt(x=>x.t.fib>=x.T.fib*.95)>=5],['su','Su perisi','7 gün su hedefi',waterDays>=7],
    ['renk','Renkli tabak','Bir günde 5 porsiyon sebze/meyve',veg>=1],['denge','Dengede','10 gün hedefin ±%10\'unda',cnt(x=>Math.abs(x.t.kcal-x.T.kcal)<=x.T.kcal*.1&&x.t.secs>=3)>=10],
    ['spor','Hareketli','5 spor seansı',sess>=5],['tarti','Tartıyla dost','10 tartı kaydı',wn>=10],['tarif','Şef','İlk tarifini oluşturdun',S.myFoods.some(f=>f.items)],['yedek','Güvende','İlk yedeğini aldın',!!S.lastBackup]]}
function badgeSVG(on){return`<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M18 9l2.5-5 3.5 4 3.5-4L30 9" fill="none" stroke="${on?'var(--leaf)':'var(--muted)'}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="24" cy="27" r="16" fill="${on?'var(--garnet)':'var(--seedoff)'}"/>${on?'<circle cx="18" cy="24" r="2.6" fill="#fff" opacity=".9"/><circle cx="25" cy="30" r="2.6" fill="#fff" opacity=".7"/><circle cx="30" cy="22" r="2.6" fill="#fff" opacity=".8"/><circle cx="20" cy="33" r="2.2" fill="#fff" opacity=".5"/>':''}</svg>`}

/* ---------- pomegranate ---------- */
const SEEDS=(()=>{const a=[];const cx=80,cy=96,R=50;for(let y=-R;y<=R;y+=11)for(let x=-R;x<=R;x+=12){const xx=x+((Math.round((y+R)/11))%2?6:0);if(Math.hypot(xx,y)<=R-6)a.push([cx+xx,cy+y])}return a.sort((p,q)=>q[1]-p[1]||p[0]-q[0])})();
function pomSVG(frac){const n=SEEDS.length;const on=Math.round(clamp(frac,0,1)*n);const over=frac>1.05;
  return`<svg viewBox="0 0 160 170" role="img" aria-label="Günlük kalori: yüzde ${Math.round(frac*100)}">

  ${SEEDS.map(([x,y],i)=>`<ellipse cx="${x}" cy="${y}" rx="4.6" ry="5.4" fill="${i<on?(over?'var(--amber)':'var(--seed)'):'var(--seedoff)'}"${i<on?' stroke="var(--garnet)" stroke-opacity=".35"':''}/>`).join('')}

let tT=null;function toast(msg,undo){$('#tMsg').textContent=msg;const u=$('#tUndo');u.hidden=!undo;u.onclick=()=>{undo&&undo();hideToast()};$('#toast').classList.add('on');clearTimeout(tT);tT=setTimeout(hideToast,undo?5000:2600)}

function addSheet(k,mode='ara',q=''){const ml=MEALS.find(m=>m[0]===k)[1];
  const draw=()=>{openSheet(`<h2>${esc(ml)} öğününe ekle</h2>
    <div class="f" style="margin-top:10px"><input type="text" id="fq" placeholder="Yiyecek ara: yoğurt, mercimek, latte…" value="${esc(q)}" autocomplete="off" enterkeyhint="search" aria-label="Yiyecek ara"></div>

      if(b.dataset.cmb){const c=S.combos.find(x=>x.id===b.dataset.cmb);if(c){closeSheet();addCombo(k,c)}return}
      if(b.dataset.cdel){const c=S.combos.find(x=>x.id===b.dataset.cdel);if(c)ask(`"${c.name}" kayıtlı öğünlerden silinsin mi?`,'Sil',()=>{S.combos=S.combos.filter(x=>x!==c);save();addSheet(k,'cmb')});return}if(b.id==='nRc'){recipeForm(k);return}

function portionSheet(k,pick){const{src,f,ref}=pick;let m=1,g=null,mode='m';const uN=f.unit.replace(/^1\s+/,'');const ml=MEALS.find(x=>x[0]===k)[1];

/* ---------- weekly budget ---------- */
function weekBudget(dt){const ws=weekStart(dt);let eat=0,tg=0,n=0;for(let i=0;i<7;i++){const k=addDays(ws,i);if(k>dt)break;const t=totals(S.days[k]);if(!t.n||(k===dt&&k===today()))continue;eat+=t.kcal;tg+=targets(k).kcal;n++}
  const rest=diffDays(addDays(ws,6),dt)+1;return{ws,eat,tg,n,bal:tg-eat,rest}}
function budgetHTML(){if(!S.profile)return'';const b=weekBudget(CUR);if(!b.n)return'';const floor=P().sex==='e'?1500:1200;const T=targets(CUR);const pct=b.tg?b.eat/b.tg*100:0;let msg,c;
  if(Math.abs(b.bal)<=b.tg*.05){msg='Hafta yolunda. Önceki günler hedefe çok yakın.';c='var(--leaf)'}
  else if(b.bal>0){msg=`Önceki ${b.n} günde hedefin ${fx(b.bal)} kcal altında kaldın. Telafi etmeye çalışma; bugünkü hedefin aynı.`;c='var(--leaf)'}
  else{const per=Math.round(-b.bal/b.rest/10)*10;const room=Math.max(0,T.kcal-floor);const cut=Math.min(per,room,300);msg=`Bu hafta önceki ${b.n} günde ${fx(-b.bal)} kcal fazladasın.${cut>=50?` İstersen kalan ${b.rest} güne yayıp günde ~${fx(cut)} kcal az yiyebilirsin; zorunlu değil, bir gün haftayı bozmaz.`:' Bir gün haftayı bozmaz; normal hedefle devam.'}`;c='var(--amber)'}
  return`<div class="card"><h2>Haftalık bütçe <span class="sp sub">${fmtShort(b.ws)}'den beri</span></h2><div class="mac"><div class="t"><span>${fx(b.eat)} / ${fx(b.tg)} kcal</span><em>${b.n} kayıtlı gün</em></div><div class="bar" style="--c:${c}"><i style="width:${clamp(pct)}%"></i></div></div><p class="sub" style="margin:8px 0 0">${esc(msg)}</p></div>`}
/* ---------- goal & milestones ---------- */
function trendRate(dt){const s=trendSeries(addDays(dt,-28),dt);const ws=Object.keys(S.days).filter(k=>k>addDays(dt,-29)&&k<=dt&&S.days[k].w!=null).length;if(s.length<14||ws<4)return null;
  const xs=s.map(x=>diffDays(x.d,s[0].d)),ys=s.map(x=>x.t);const mx=xs.reduce((a,b)=>a+b)/xs.length,my=ys.reduce((a,b)=>a+b)/ys.length;let nu=0,de=0;xs.forEach((x,i)=>{nu+=(x-mx)*(ys[i]-my);de+=(x-mx)**2});return de?nu/de*7:null}
function goalInfo(dt){const tw=num(P().targetW);const s=trendSeries(addDays(dt,-1),dt);const cur=s.length?s[s.length-1].t:null;if(tw==null||cur==null)return null;const diff=cur-tw;const rate=trendRate(dt);let eta=null;
  if(rate&&Math.abs(diff)>=.2&&Math.sign(rate)===-Math.sign(diff)&&Math.abs(rate)>=.05){const w=Math.abs(diff/rate);if(w<=104)eta=addDays(dt,Math.round(w*7))}return{tw,cur,diff,rate,eta}}
function checkMilestone(){const all=trendSeries('0000-01-01',today());if(all.length<7)return;const start=all[0].t,cur=all[all.length-1].t;const g=P().goal;const ch=g==='al'?cur-start:start-cur;const n=Math.floor(ch+1e-9);
  const ms=S.ms||{n:0};if(n>=1&&n>ms.n){S.ms={n,d:today()};save()}}
function milestoneHTML(){const ms=S.ms;if(!ms||!ms.d||diffDays(today(),ms.d)>3||CUR!==today())return'';const g=P().goal==='al'?'aldın':'verdin';
  return`<div class="note" style="--c:var(--leaf)"><b>Trendinde ${ms.n} kg ${g}</b>Tartının günlük oynamalarından bağımsız, gerçek değişim bu. Tebrikler!</div>`}

function cycleHTML(dt){const c=cycleInfo(dt);if(!c)return'<p class="sub" style="margin:8px 0 0">Regl günlerini işaretlersen bir sonraki dönemi tahmin eder, o haftalardaki kilo artışını açıklarım.</p>';
  const s=trendSeries(addDays(dt,-7),dt);const w=(S.days[dt]||{}).w;const tN=s.length?s[s.length-1]:null;const up=tN&&((w!=null&&w-tN.t>=.5)||(s.length>6&&tN.t-s[0].t>=.3));const near=c.inPeriod||(c.toNext>=0&&c.toNext<=7);
  let h=`<p class="sub" style="margin:8px 0 0">Son başlangıç ${fmtShort(c.last)} · tahmini sonraki dönem <b>~${fmtShort(c.next)}</b> (${c.est?'varsayılan 28 gün; birkaç döngü işaretleyince kendi ortalamana göre hesaplanır':'döngü ortalaman '+c.len+' gün'}).</p>`;
  if(near&&up)h+=`<div class="note" style="--c:var(--violet);margin:10px 0 0"><b>Bu artış büyük ihtimalle su</b>Regl öncesi ve sırasında vücut su tutar; tartı genellikle 0,5–2 kg yükselir ve dönem bitince geri iner. Bu günlerdeki tartıya göre hedef değiştirme.</div>`;
  else if(near&&!c.inPeriod)h+=`<p class="sub" style="margin:6px 0 0">Önümüzdeki günlerde tartı geçici olarak yükselebilir; bu yağ değil, su tutulumu.</p>`;return h}
function goalHTML(){const g=goalInfo(CUR);if(!g){return num(P().targetW)==null?`<div class="card"><h2>Hedef kilo</h2><p class="sub" style="margin:0">Ayarlar'dan bir hedef kilo girersen, trendine göre ne zaman ulaşacağını tahmin ederim.</p></div>`:''}
  const done=Math.abs(g.diff)<.2;const r=g.rate;
  return`<div class="card"><h2>Hedef kilo <span class="sp sub">${fx(g.tw,1)} kg</span></h2>${done?`<p style="margin:0"><b>Hedefindesin.</b> Artık amaç korumak; Ayarlar'dan hedefi "Korumak"a çevirebilirsin.</p>`:
    `<div class="stat3"><div><b class="num">${fx(Math.abs(g.diff),1)}</b><span>kg ${g.diff>0?'verilecek':'alınacak'}</span></div><div><b class="num">${r==null?'–':(r>0?'+':'')+fx(r,2)}</b><span>kg / hafta</span></div><div><b class="num">${g.eta?fmtShort(g.eta):'–'}</b><span>tahmini varış</span></div></div>
    <p class="sub" style="margin:8px 0 0">${r==null?'Tahmin için son 4 haftada en az 4 tartı ve 2 haftalık trend gerekiyor.':g.eta?'Son 4 haftanın trend hızıyla. Hız değiştikçe tarih de güncellenir.':'Trend şu an hedefin yönünde ilerlemiyor; birkaç hafta ortalamaya bak.'}</p>`}</div>`}

  const setF=(id,key)=>{$(id).onchange=e=>{const v=num(e.target.value);const dd=D(CUR);if(v==null||v<=0)delete dd[key];else dd[key]=v;save();renderBody();if(key==='w')toast('Kilo kaydedildi')}};
  setF('#bW','w');setF('#bWa','waist');setF('#bN','neck');setF('#bH','hip');const pe=$('#bPer');if(pe)pe.onchange=()=>{const dd=D(CUR);if(pe.checked)dd.period=true;else delete dd.period;save();renderBody()};
  chart('#wFig',(svg,W,H)=>{const from=addDays(CUR,-59);const s=trendSeries(from,CUR);if(!s.length){svg.innerHTML=`<text x="${W/2}" y="${H/2}" text-anchor="middle">Kilo girdikçe grafik burada oluşur</text>`;return}
    const vals=s.flatMap(x=>[x.t,x.w].filter(v=>v!=null));let lo=Math.min(...vals),hi=Math.max(...vals);if(hi-lo<2){const c=(hi+lo)/2;lo=c-1;hi=c+1}lo-=.3;hi+=.3;
    const L=34,R=8,Tp=8,B=22;const X=dt=>L+(W-L-R)*diffDays(dt,from)/59,Y=v=>Tp+(H-Tp-B)*(1-(v-lo)/(hi-lo));let o='';
    Object.keys(S.days).filter(k=>k>=from&&k<=CUR&&S.days[k].period).forEach(k=>{o+=`<rect x="${X(k)-3}" y="${Tp}" width="${Math.max(4,(W-L-R)/59)}" height="${H-Tp-B}" fill="var(--seed)" opacity=".12"/>`});
    [lo+.3,(lo+hi)/2,hi-.3].forEach(v=>{o+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end">${fx(v,1)}</text>`});
    [0,30,59].forEach(i=>{const dt=addDays(from,i);o+=`<text x="${X(dt)}" y="${H-4}" text-anchor="${i===0?'start':i===59?'end':'middle'}">${fmtShort(dt)}</text>`});
    o+=`<path d="${s.map((x,i)=>(i?'L':'M')+X(x.d).toFixed(1)+' '+Y(x.t).toFixed(1)).join('')}" fill="none" stroke="var(--garnet)" stroke-width="2.6" stroke-linejoin="round"/>`;
    s.filter(x=>x.w!=null).forEach(x=>{o+=`<circle cx="${X(x.d)}" cy="${Y(x.w)}" r="3.4" fill="var(--card)" stroke="var(--seed)" stroke-width="2"/>`});svg.innerHTML=o})}

let WK=null;
function renderWeek(){const el=$('#t-hafta');const ws=WK||weekStart(today());const days=Array.from({length:7},(_,i)=>addDays(ws,i));const rows=days.map(k=>({k,t:totals(S.days[k]),T:targets(k),d:S.days[k]||{}}));
  const lg=rows.filter(r=>r.t.n);const avg=f=>lg.length?lg.reduce((s,r)=>s+r.t[f],0)/lg.length:null;const avgT=f=>lg.length?lg.reduce((s,r)=>s+r.T[f],0)/lg.length:null;
  const onT=rows.filter(r=>r.t.secs>=3&&Math.abs(r.t.kcal-r.T.kcal)<=r.T.kcal*.1).length;const pro=rows.filter(r=>r.t.n&&r.t.p>=r.T.p*.95).length;const wat=rows.filter(r=>(r.d.water||0)>=r.T.water).length;
  const sportMin=rows.reduce((s,r)=>s+(r.d.acts||[]).reduce((a,x)=>a+(x.min||0),0),0);const qs=rows.map(r=>({k:r.k,q:dietQuality(r.k)})).filter(x=>x.q);
  const bestP=lg.slice().sort((a,b)=>b.t.p-a.t.p)[0];const bestQ=qs.slice().sort((a,b)=>b.q.score-a.q.score)[0];
  const tr=trendSeries(addDays(ws,-1),addDays(ws,6));const wd=tr.length>1?tr[tr.length-1].t-tr[0].t:null;
  const isCur=ws===weekStart(today());
  const hil=[];if(bestP)hil.push([`${fx(bestP.t.p)} g`,`en yüksek protein · ${GUN[pd(bestP.k).getDay()]}`]);if(bestQ)hil.push([bestQ.q.score,`en iyi tabak puanı · ${GUN[pd(bestQ.k).getDay()]}`]);if(wat)hil.push([`${wat} gün`,'su hedefi tuttu']);if(sportMin)hil.push([`${sportMin} dk`,'spor']);if(onT)hil.push([`${onT} gün`,'kalori hedefinin ±%10\'unda']);
  el.innerHTML=`<div class="row" style="margin:0 0 12px;flex-wrap:nowrap"><button class="ib" id="wPrev" aria-label="Önceki hafta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 5l-7 7 7 7"/></svg></button><h2 style="flex:1;text-align:center;font-size:17px">${fmtShort(ws)} – ${fmtShort(addDays(ws,6))}</h2><button class="ib" id="wNext" aria-label="Sonraki hafta" ${isCur?'disabled':''}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 5l7 7-7 7"/></svg></button></div>
  ${hil.length?`<div class="card hi"><h2>${isCur?'Bu haftanın en iyileri':'Haftanın en iyileri'}</h2><ul class="hil">${hil.map(([a,b])=>`<li><b class="num">${esc(a)}</b><span>${esc(b)}</span></li>`).join('')}</ul></div>`:''}
  <div class="card"><div class="stat3"><div><b class="num">${fx(avg('kcal'))}</b><span>ort. kcal / ${fx(avgT('kcal'))}</span></div><div><b class="num">${lg.length}/7</b><span>kayıtlı gün</span></div><div><b class="num">${wd==null?'–':(wd>0?'+':'')+fx(wd,1)}</b><span>trend kilo</span></div></div>
    <div class="fig" id="kFig"><svg></svg></div><p class="sub" style="margin:4px 0 0">Çubuklar günlük kalori; çizgi o günün hedefi.</p></div>
  <div class="card"><h2>Ortalama makrolar</h2><div class="macros" style="margin-top:4px">${[['Protein','p','p','var(--garnet)'],['Karbonhidrat','c','carb','var(--amber)'],['Yağ','f','fat','var(--violet)'],['Lif','fib','fib','var(--leaf)']].map(([l,f,tf,c])=>{const v=avg(f),t=avgT(tf);return`<div class="mac"><div class="t"><span>${l}</span><em>${fx(v)}/${fx(t)} g</em></div><div class="bar" style="--c:${c}"><i style="width:${clamp(t?(v||0)/t*100:0)}%"></i></div></div>`}).join('')}</div>
    <p class="sub" style="margin:12px 0 0">Protein hedefi ${pro} gün tuttu.</p></div>
  <div class="card"><h2>Gün gün</h2><div class="scroll"><table class="wk"><thead><tr><th>Gün</th><th>kcal</th><th>P</th><th>Lif</th><th>Su</th><th>Puan</th></tr></thead><tbody>${rows.map(r=>{const q=dietQuality(r.k);return`<tr><td>${GK[pd(r.k).getDay()]} ${pd(r.k).getDate()}</td><td>${r.t.n?fx(r.t.kcal):'–'}</td><td class="${r.t.n&&r.t.p>=r.T.p*.95?'ok':''}">${r.t.n?fx(r.t.p):'–'}</td><td class="${r.t.n&&r.t.fib>=r.T.fib*.95?'ok':''}">${r.t.n?fx(r.t.fib):'–'}</td><td class="${(r.d.water||0)>=r.T.water?'ok':''}">${r.d.water||'–'}</td><td>${q?q.score:'–'}</td></tr>`}).join('')}</tbody></table></div></div>
  <div class="card"><h2>Rozetler <span class="sp sub">en uzun seri ${bestStreak()} gün</span></h2><div class="badges">${badgeList().map(([id,n,dsc,on])=>`<div class="bd ${on?'on':''}">${badgeSVG(on)}<b>${esc(n)}</b><small>${esc(dsc)}</small></div>`).join('')}</div></div>`;
  $('#wPrev').onclick=()=>{WK=addDays(ws,-7);renderWeek()};$('#wNext').onclick=()=>{if(!isCur){WK=addDays(ws,7);renderWeek()}};
  chart('#kFig',(svg,W,H)=>{const L=8,R=8,Tp=10,B=22;const mx=Math.max(...rows.map(r=>Math.max(r.t.kcal,r.T.kcal)),500)*1.08;const bw=(W-L-R)/7;const Y=v=>Tp+(H-Tp-B)*(1-v/mx);let o='';
    rows.forEach((r,i)=>{const x=L+i*bw;const h=H-B-Y(r.t.kcal);const ov=r.t.kcal>r.T.kcal*1.1;o+=`<rect x="${x+bw*.2}" y="${Y(r.t.kcal)}" width="${bw*.6}" height="${Math.max(0,h)}" rx="6" fill="${!r.t.n?'var(--seedoff)':ov?'var(--amber)':'var(--seed)'}"/>`;
      o+=`<line x1="${x+bw*.1}" x2="${x+bw*.9}" y1="${Y(r.T.kcal)}" y2="${Y(r.T.kcal)}" stroke="var(--ink)" stroke-width="2" stroke-dasharray="3 3" opacity=".55"/>`;
      o+=`<text x="${x+bw/2}" y="${H-5}" text-anchor="middle" ${r.k===today()?'style="fill:var(--garnet);font-weight:700"':''}>${GK[pd(r.k).getDay()]}</text>`;if(r.t.n&&W>420)o+=`<text x="${x+bw/2}" y="${Y(r.t.kcal)-5}" text-anchor="middle">${fx(r.t.kcal)}</text>`});svg.innerHTML=o})}

    if(!p.age||!p.height||!w){return'Yaş, boy ve kilo gerekli.'}S.profile=p;save();onDone&&onDone();return null}}
function onboarding(){openSheet(`<h2>Nar'a hoş geldin</h2><p class="sub" style="margin:0 0 12px">Günlük kalori ve makro hedeflerini bunlarla hesaplıyorum. Sonra Ayarlar'dan değiştirebilirsin.</p>${profileForm(true)}<p class="sub" id="oMsg" style="min-height:20px"></p><button class="btn" id="oOk" style="width:100%">Hedeflerimi hesapla</button>`);
  const get=bindProfile(()=>{closeSheet();render();const T=targets(today());openSheet(`<h2>Günlük hedeflerin</h2><div class="psum"><b class="num">${fx(T.kcal)}</b><span>kcal</span><small>Protein ${T.p} g · Karbonhidrat ${T.carb} g · Yağ ${T.fat} g · Lif ${T.fib} g</small></div><p class="sub" style="margin:12px 0 0">Bazal metabolizma ~${fx(T.bmr)} kcal, günlük harcama ~${fx(T.tdee)} kcal (Mifflin–St Jeor).${T.floored?' Hesap güvenli alt sınırın altına düştüğü için hedef alt sınırda tutuldu.':''} Spor yaptığın günler hedef biraz artar.</p><button class="btn" style="width:100%;margin-top:14px" id="oGo">Başlayalım</button>`);$('#oGo').onclick=closeSheet},true);
  $('#oOk').onclick=()=>{const err=get();if(err)$('#oMsg').textContent=err}}
function renderSettings(){const el=$('#t-ayar');const T=S.profile?targets(today()):null;const nd=Object.keys(S.days).length;
  el.innerHTML=`<div class="card"><h2>Profil ve hedefler</h2>${T?`<div class="psum" style="margin:0 0 14px"><b class="num">${fx(T.base)}</b><span>kcal / gün (spor hariç)</span><small>Protein ${T.p} g · Karbonhidrat ~${T.carb} g · Yağ ${T.fat} g · Lif ${T.fib} g${T.bmr?` — bazal ~${fx(T.bmr)}, harcama ~${fx(T.tdee)} kcal`:''}</small></div>`:''}${profileForm(false)}<p class="sub" id="sMsg" style="min-height:20px"></p><button class="btn" id="sSave">Kaydet</button></div>
  <div class="card"><h2>Yedekle ve geri yükle</h2><p class="sub" style="margin:0 0 10px">Tüm kayıtların bu telefonda saklanıyor. ${S.lastBackup?`Son yedek: ${fmtShort(S.lastBackup)}.`:'Henüz yedek alınmadı.'} 7 günde bir hatırlatırım.</p>
    <div class="row"><button class="btn sm" data-act="backup">Yedek dosyası al</button><button class="btn sm ghost" data-act="import">Yedekten geri yükle</button><button class="lnk" data-act="copy">Metin olarak kopyala</button></div></div>
  <div class="card"><h2>Görünüm</h2><div class="chips">${[['auto','Otomatik'],['light','Gündüz'],['dark','Gece']].map(([k,l])=>`<button class="chip ${S.theme===k?'on':''}" data-th="${k}">${l}</button>`).join('')}</div></div>
  <div class="card"><h2>Hakkında</h2><p class="sub" style="margin:0">Hazır listede ${FDB.length} yiyecek ve içecek var; değerler 100 g başına ortalama değerlerdir, markaya ve tarife göre değişir. ${S.myFoods.length} kendi yiyeceğin/tarifin, ${nd} günlük kayıt var.</p>
    <div class="row" style="margin-top:12px"><button class="lnk" data-act="reset" style="color:var(--seed)">Tüm verileri sil</button></div></div>`;
  const get=bindProfile(()=>{render();toast('Kaydedildi')},false);$('#sSave').onclick=()=>{const err=get();$('#sMsg').textContent=err||''}}

/* ---------- backup ---------- */
let DL=null;try{if(window.claude&&claude.use)claude.use('downloads').then(d=>{DL=d}).catch(()=>{})}catch(e){}
const exportText=()=>JSON.stringify({app:'nar',v:1,exportedAt:new Date().toISOString(),data:S});
async function doBackup(){const txt=exportText();const fn=`nar-yedek-${today()}.json`;let ok=false;
  if(DL){try{await DL.save({filename:fn,data:txt});ok=true}catch(e){}}
  if(!ok&&!DL){try{const file=new File([txt],fn,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Nar yedeği'});ok=true}}catch(e){if(e&&e.name==='AbortError')return}}
  if(!ok){try{const u=URL.createObjectURL(new Blob([txt],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);ok=true}catch(e){}}
  if(ok){S.lastBackup=today();save();render();toast('Yedek dosyası hazır')}else copySheet()}
function copySheet(){openSheet(`<h2>Yedek metni</h2><p class="sub" style="margin:0 0 10px">Kopyalayıp Notlar'a ya da kendine mesaj olarak kaydet. Geri yüklerken bir .json dosyası olarak seçebilirsin.</p><textarea id="cpT" readonly>${esc(exportText())}</textarea><div class="row" style="margin-top:12px"><button class="btn" id="cpB">Kopyala</button><button class="btn ghost" id="cpX">Kapat</button></div>`);
  $('#cpB').onclick=async()=>{try{await navigator.clipboard.writeText($('#cpT').value);S.lastBackup=today();save();toast('Kopyalandı')}catch(e){$('#cpT').select();toast('Seçili metni kopyala')}};$('#cpX').onclick=()=>{closeSheet();render()}}
$('#impF').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{const o=JSON.parse(await f.text());if(o.app!=='nar'||!o.data||!o.data.days)throw 0;
  const n=Object.keys(o.data.days).length;ask(`${n} günlük yedek yüklensin mi? Bu telefondaki mevcut kayıtların yerine geçer.`,'Geri yükle',()=>{S=Object.assign(blank(),o.data);save();applyTheme();render();toast('Yedek geri yüklendi')})}catch(err){toast('Bu dosya bir Nar yedeği değil')}};

/* ---------- global events ---------- */
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.closest('#sh'))return;
  if(b.dataset.tab){setTab(b.dataset.tab);return}
  if(b.dataset.add){addSheet(b.dataset.add);return}
  if(b.dataset.savec){saveCombo(b.dataset.savec);return}
  if(b.dataset.item){const[k,id]=b.dataset.item.split(':');itemSheet(k,id);return}
  if(b.dataset.copy){const k=b.dataset.copy;const y=((S.days[addDays(CUR,-1)]||{}).meals||{})[k]||[];const d=D(CUR);d.meals=d.meals||{};const added=y.map(x=>({...x,id:uid()}));d.meals[k]=(d.meals[k]||[]).concat(added);save();render();toast(`${added.length} yiyecek kopyalandı`,()=>{const ids=new Set(added.map(x=>x.id));d.meals[k]=d.meals[k].filter(x=>!ids.has(x.id));save();render()});return}
  if(b.dataset.gl!=null){const i=+b.dataset.gl;const d=D(CUR);d.water=(d.water||0)===i+1?i:i+1;save();renderToday();return}
  if(b.dataset.actEd){const a=((S.days[CUR]||{}).acts||[]).find(x=>x.id===b.dataset.actEd);if(a)sportSheet(a);return}
  if(b.dataset.th){S.theme=b.dataset.th;save();applyTheme();renderSettings();return}
  const act=b.dataset.act;if(!act)return;
  if(act==='onb')onboarding();else if(act==='sport')sportSheet();else if(act==='backup')doBackup();else if(act==='copy')copySheet();else if(act==='import')$('#impF').click();
  else if(act==='nag'){S.backupNag=today();save();renderToday()}
  else if(act==='reset')ask('Tüm kayıtlar, kendi yiyeceklerin ve ayarların silinsin mi? Önce yedek almanı öneririm.','Hepsini sil',()=>{S=blank();save();render();toast('Veriler silindi')})});
$('#dPrev').onclick=()=>{CUR=addDays(CUR,-1);render()};$('#dNext').onclick=()=>{if(CUR<addDays(today(),1)){CUR=addDays(CUR,1);render()}};$('#dLab').onclick=()=>{CUR=today();render()};
function setTab(t){TAB=t;$$('section.tab').forEach(s=>s.classList.toggle('on',s.id==='t-'+t));$$('nav.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));render();window.scrollTo({top:0})}
function applyTheme(){const h=document.documentElement;if(S.theme==='light'||S.theme==='dark')h.dataset.theme=S.theme;else delete h.dataset.theme}
const OBS=new Map();
function chart(sel,fn){const box=$(sel);if(!box)return;const svg=box.querySelector('svg');const draw=()=>{const W=box.clientWidth,H=box.clientHeight;if(W>0)fn(svg,W,H)};if(OBS.has(sel))OBS.get(sel).disconnect();const ro=new ResizeObserver(draw);ro.observe(box);OBS.set(sel,ro);draw()}
function render(){try{checkMilestone()}catch(e){}greet();dateLab();if(TAB==='bugun')renderToday();else if(TAB==='vucut')renderBody();else if(TAB==='hafta')renderWeek();else renderSettings()}
let lastDay=today();setInterval(()=>{const t=today();if(t!==lastDay){if(CUR===lastDay)CUR=t;lastDay=t;render()}},60000);
applyTheme();render();if(!S.profile)setTimeout(onboarding,300);
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator)window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});
}
</script>
</body>
